<style>
  :root{
    --bg:#0B0E10; --panel:#13181C; --panel-2:#171D22;
    --ink:#E9E7E1; --dim:#71808B; --osd:#F2B441; --rec:#E5484D; --line:#242C33;
    --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow-x:hidden;
    padding-bottom:56px}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:200;
    background:repeating-linear-gradient(to bottom,rgba(255,255,255,.028) 0 1px,transparent 1px 3px)}
  a{color:inherit}
  .wrap{max-width:960px;margin:0 auto;padding:0 14px}

  /* ---------- sticky bar ---------- */
  .bar{position:sticky;top:0;z-index:100;background:rgba(11,14,16,.94);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar-in{max-width:960px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
  .brand{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--ink);cursor:pointer;
    background:none;border:0;padding:0;flex:none}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--rec);animation:blink 1.6s steps(1) infinite}
  @keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.15}}
  #search{flex:1;min-width:0;font-family:var(--mono);font-size:13px;background:var(--panel);
    color:var(--ink);border:1px solid var(--line);border-radius:2px;padding:9px 11px}
  #search::placeholder{color:var(--dim)}
  #search:focus{outline:none;border-color:var(--osd)}

  /* ---------- chips ---------- */
  .chips{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 12px;
    max-width:960px;margin:0 auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    background:transparent;color:var(--dim);border:1px solid var(--line);border-radius:2px;
    padding:8px 11px;cursor:pointer;white-space:nowrap}
  .chip[aria-pressed="true"]{color:var(--bg);background:var(--osd);border-color:var(--osd)}

  /* ---------- hero ---------- */
  .hero{padding:26px 0 4px}
  h1{font-size:clamp(32px,9vw,54px);line-height:.92;letter-spacing:-.03em;font-weight:800;
    margin:0 0 12px;text-transform:uppercase}
  h1 em{font-style:normal;color:var(--osd)}
  .lede{font-family:var(--mono);font-size:12px;line-height:1.65;color:var(--dim);max-width:52ch;margin:0}
  .hero-tools{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

  .btn{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:2px;
    padding:10px 14px;cursor:pointer}
  .btn:active{background:var(--panel-2)}
  .btn:focus-visible{outline:2px solid var(--osd);outline-offset:2px}
  .btn.done{border-color:var(--osd);color:var(--osd)}

  /* ---------- group heading ---------- */
  .group{margin:30px 0 2px}
  .group h2{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--osd);margin:0 0 4px;display:flex;align-items:center;gap:11px}
  .group h2::after{content:"";flex:1;height:1px;background:var(--line)}
  .group p{font-family:var(--mono);font-size:11px;color:var(--dim);margin:0;line-height:1.5}

  /* ---------- grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 0}
  @media (min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
  .tile{background:var(--panel);border:1px solid var(--line);padding:0;text-align:left;
    cursor:pointer;display:block;width:100%;color:inherit;font:inherit;position:relative}
  .tile:active{border-color:var(--osd)}
  .tile-img{aspect-ratio:4/3;background:#000;overflow:hidden;line-height:0;position:relative}
  .tile-img img{width:100%;height:100%;object-fit:cover;display:block}
  .shot.single{display:flex;justify-content:center;background:#000}
  .shot.single img{width:auto;max-width:100%;max-height:min(74vh,620px)}
  .tile-n{position:absolute;top:0;left:0;font-family:var(--mono);font-size:9px;letter-spacing:.14em;
    color:var(--osd);background:rgba(0,0,0,.75);padding:3px 5px}
  .tile-body{padding:9px 10px 11px}
  .tile-body h3{margin:0;font-size:13px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
  .tile-body span{display:block;margin-top:5px;font-family:var(--mono);font-size:9.5px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .flag{position:absolute;top:0;right:0;width:0;height:0;
    border-top:16px solid var(--osd);border-left:16px solid transparent}

  .empty{font-family:var(--mono);font-size:12px;color:var(--dim);padding:36px 0;line-height:1.6}

  /* ---------- detail ---------- */
  .detail{padding:18px 0 0}
  .crumb{display:flex;gap:8px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  .kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim)}
  .kicker b{color:var(--osd);font-weight:400}
  .detail h1{font-size:clamp(26px,7.4vw,42px);margin:0 0 10px}
  .use{font-family:var(--mono);font-size:12px;color:var(--dim);line-height:1.6;margin:0 0 14px;max-width:56ch}
  .note{font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--osd);
    border-left:2px solid var(--osd);padding:9px 0 9px 11px;margin:0 0 16px;max-width:60ch}
  .shot{margin:0 0 16px;border:1px solid var(--line);background:#000;line-height:0;position:relative}
  .shot img{width:100%;height:auto;display:block}
  .shot figcaption{position:absolute;left:0;bottom:0;font-family:var(--mono);font-size:9px;
    letter-spacing:.16em;color:var(--osd);background:rgba(0,0,0,.72);padding:3px 6px}
  .prompt{font-family:var(--mono);font-size:12.5px;line-height:1.65;color:#CFD4D8;
    background:var(--panel-2);border:1px solid var(--line);border-left:2px solid var(--osd);
    padding:14px 14px;margin:0 0 12px;white-space:pre-wrap}
  .detail-foot{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
  .pager{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:16px;margin-bottom:10px}
  .pager .btn{flex:1;text-align:center}
  .pager .btn[disabled]{opacity:.3;cursor:default}

  footer{border-top:1px solid var(--line);margin-top:38px;padding:16px 0 0;
    font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.06em;
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;line-height:1.7}
  footer a{color:var(--dim)}
  .stamp{color:var(--osd);opacity:.8}

  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>

<script>
const CATS = {"grade": {"label": "Grade & light", "blurb": "Color, lighting and mood only. The photo underneath stays as shot."}, "camera": {"label": "Camera emulation", "blurb": "Pretend it was captured on older or worse gear."}, "machine": {"label": "Machine vision", "blurb": "Thermal, microscope, point-cloud. Sensor renders, not photographs."}, "drawn": {"label": "Illustrated", "blurb": "Redrawn by hand into another medium: ink, print, mosaic, paint."}, "pixel": {"label": "Pixel & voxel", "blurb": "Game-engine looks. Blocks, sprites, limited palettes."}, "scene": {"label": "Objects & scenes", "blurb": "Rebuilds what's in the frame or adds to it. Toys, chrome, composites."}, "motion": {"label": "Analog motion", "blurb": "Long-exposure smear and VHS ghosting. Portraits torn sideways by movement."}};
const FILTERS = [{"n": "01", "src_set": "Set 01", "name": "iPhone Blurry Effect", "use": "Long-exposure handheld shake. Subject stays razor sharp, everything else smears.", "note": "", "p": "Apply an aggressive, high-intensity handheld camera-shake effect as if the photographer took the shot while walking quickly or violently shaking the camera during a long exposure. Keep the main subject perfectly sharp, frozen, and photorealistic with NO distortion to the face, body, pose, outfit, or core structure. Only the background and trailing edges should show motion.\n\nCreate chaotic left-to-right motion streaks across the entire scene:\n- long, thick luminous smears\n- doubled and tripled motion trails\n- jittery horizontal vibrations\n- wide bands of stretched highlights and reflections\n- soft darkness pulled into bright streaks\n\nSimulate real aggressive camera movement:\n- introduce micro-jitters inside the streaks\n- layer multiple blur directions (primary horizontal + subtle diagonal wobble)\n- uneven intensity across the smear, as if the camera shook erratically\n\nBlend multiple ghost gradients tightly around the subject's silhouette:\n- soft, semi-transparent contour trails hugging hair, shoulders, arms, torso, and clothing edges\n- trails should feel like light being torn backward, not duplicated subjects\n- allow the dominant color of the subject's outfit to softly bleed into the motion blur behind them\n\nIncrease the glow and drag of all bright elements in the scene:\n- highlights stretch into thick glowing ribbons\n- reflections smear dramatically\n- bright colors bleed together into a continuous motion wash\n\nEverything must remain fully blended, fluid, and organic \u2014 no hard edges, no cutout look. The background should feel like an explosive burst of motion and energy, while the subject remains perfectly crisp and untouched. The final image must look like a real extreme long-exposure photograph with aggressive handheld shake.", "cat": "camera"}, {"n": "02", "src_set": "Set 01", "name": "Cinematic Filter", "use": "Warm rim light, crushed teal shadows, heavy grain. The A24 look.", "note": "", "p": "Transform the source image into a high-resolution, moody cinematic film still, while maintaining absolute fidelity to the 100% original subject's facial features, pose, and gender. Keep the person's pose exactly 100% the same as the real image. Perform a hyper-realistic upscale, bringing the subject into extremely sharp focus. Significantly enhance and sharpen skin texture to be incredibly detailed and lifelike, showing visible pores, fine lines, and realistic definition. Apply dramatic, low-key backlighting that casts intense warm orange and deep amber tones as the dominant light source, creating strong rim lighting and a heated glow around the silhouette. The shadows must be crushed deep black, with distinct cool teal and muted dark green undertones visible in the darker background areas. Add a heavy, authentic analog film grain texture over the entire image. Shallow depth of field, high contrast chiaroscuro lighting, atmospheric, emotional, dark cinematic aesthetic.", "cat": "grade"}, {"n": "03", "src_set": "Set 01", "name": "Dark Aesthetic Filter", "use": "Underground rap editorial. Spotlight, crushed blacks, jewelry that screams.", "note": "", "p": "FULL cinematic remaster of the original image with dramatic relighting and high-end fashion editorial quality. Preserve identity, pose, and outfit, but completely reinterpret lighting, contrast, and atmosphere.\n\nLighting: strong directional studio lighting, deep shadows, high contrast chiaroscuro, bright specular highlights on jewelry and skin, dark background falloff, spotlight effect on subject.\n\nExposure: intentionally underexposed base with controlled highlight bloom, crushed blacks with preserved micro-details in shadows.\n\nJewelry focus: extreme shine and brilliance on chains, pendants, and metal, sharp reflective highlights, diamonds sparkling under hard light.\n\nColor grading: dark, moody, desaturated tones, cool shadows, slightly metallic feel, high contrast luxury editorial grading (NOT natural).\n\nTexture: ultra high definition, crisp details, visible pores, fabric texture, slight cinematic grain for analog feel.\n\nAtmosphere: gritty underground rap aesthetic, dramatic, raw, intense, looks like a high-budget magazine shoot in a dark studio.\n\nLens: 85mm portrait, shallow depth of field, subject isolated.\n\nIMPORTANT:\n- keep same person and outfit\n- do NOT smooth skin excessively\n- do NOT flatten lighting\n- push contrast, lighting, and mood aggressively", "cat": "grade"}, {"n": "04", "src_set": "Set 01", "name": "CCD Nightshot Filter", "use": "Early-2000s green night vision. Handycam Nightshot, not sci-fi green.", "note": "", "p": "Transform the uploaded image into an authentic early-2000s digital night-vision photograph. Preserve the subject's identity, facial features, clothing, accessories, hairstyle, pose, composition, and framing exactly. Do not redesign or stylize the subject. Only change the photographic appearance. Convert the image into a monochromatic infrared-style green night-vision aesthetic with realistic low-light camera characteristics. The scene should appear illuminated only by a weak infrared/night-vision light source positioned close to the camera. The image should have: authentic green night-vision coloration, deep crushed blacks, dark background with very little visible detail, subtle cyan-green highlights, high ISO digital sensor noise, realistic analog-looking grain, slight JPEG compression artifacts, soft focus, low dynamic range, slight lens bloom around bright areas, reduced contrast in midtones, natural exposure falloff, slight vignette, old consumer digital camera quality, early 2000s webcam aesthetic, infrared security camera feel, 480p camcorder texture, realistic low-light photography, imperfect image quality, subtle motion softness, authentic digital noise rather than AI grain, documentary realism. The lighting should feel as though the subject is being illuminated only by a weak night-vision camera or infrared camcorder in an otherwise dark environment. Avoid making the image cinematic, glossy, modern, HDR, or high-end. It should feel like an accidental snapshot captured on an old digital camera with night vision enabled.\n\nNegative Prompt: modern DSLR quality, HDR, cinematic lighting, colorful lighting, blue tint, sharp image, ultra clean skin, beauty retouching, high resolution, perfect focus, studio lighting, dramatic color grading, film look, orange and teal, vibrant colors, crisp details, clean digital image, AI glow, futuristic night vision, sci-fi green, cartoon, CGI, illustration, oversaturated green, smooth gradients, polished commercial photography", "cat": "camera"}, {"n": "05", "src_set": "Set 01", "name": "2000s Filter", "use": "2002 digicam with on-camera flash. Blown-out skin, bad white balance, perfect.", "note": "", "p": "Apply a realistic early-2000s digital camera (2002 digicam) aesthetic to the input image. Add direct on-camera flash effect: harsh frontal lighting, overexposed skin highlights, flat shadows, strong highlight bloom and halation around bright areas. Introduce slight motion blur from hand shake, soft focus, and imperfect autofocus. Reduce sharpness to mimic a low-end CCD sensor. Add visible digital noise, grain, and compression artifacts. Lower dynamic range: blown-out whites, crushed blacks, washed-out contrast. Color grading should feel inaccurate and dated: slight green-yellow tint, uneven white balance, subtle color banding, and plasticky skin tones. Lens imperfections: mild chromatic aberration, edge softness, slight blur, and cheap lens quality. Add a subtle dreamy glow/haze across the image, especially around lights and skin. Framing should feel imperfect and candid: slightly off-center, like a casual snapshot. Overall look: authentic 2000\u20132005 point-and-shoot camera photo, nostalgic, amateur, unpolished, raw. \"do not change composition, pose, or subject identity\" \"preserve original scene, only apply visual style\"", "cat": "camera"}, {"n": "06", "src_set": "Set 01", "name": "Red Light Filter", "use": "Deep red neon / brake-light glow. Directional, not a flat color overlay.", "note": "", "p": "Use the user uploaded image as the exact base reference. Apply a strong red aesthetic lighting effect, as if the scene is illuminated by a deep red neon light or traffic light glow at night.\n\nLighting & color treatment:\nCast a dominant red light source onto the subject's face, skin, and hair. Red light should feel directional and realistic, not a flat color overlay. Preserve natural shadows and depth while tinting highlights red. Keep blacks deep and shadows rich for a cinematic night mood. Slight warm red bloom around highlights, especially on cheekbones, nose bridge, lips, and hair strands. Subtle red color spill onto nearby surfaces (car interior, background edges if visible).\n\nMood & style:\nEditorial, cinematic, intimate night-time atmosphere. Moody, quiet, slightly dramatic feel. Looks like a candid photo taken inside a car under red street or brake lights. Fashion editorial realism, not stylized illustration.\n\nQuality & realism:\nMaintain realistic skin texture and facial details. No plastic skin, no over smoothing. Add very subtle film grain for cinematic texture. Preserve original sharpness and depth of field.\n\nHard rules (must follow):\nDo NOT change the subject's face, facial structure, hair shape, body, or expression. Do NOT change the pose, camera angle, framing, or crop. Do NOT change the outfit or accessories. Do NOT alter the background structure or objects. Do NOT change the aspect ratio. Only apply lighting, color grading, and mood enhancements. Output should look like the original photo captured under dramatic red night lighting, cinematic and realistic.", "cat": "grade"}, {"n": "07", "src_set": "Set 01", "name": "Particle Filter", "use": "Subject rebuilt from glowing white point-cloud dots on pure black. Poster energy.", "note": "", "p": "Transform the uploaded image into a high-contrast monochrome particle-render aesthetic. Subject reconstructed entirely from thousands of tiny glowing white dots and voxel-like particles on a pure black background. Use point-cloud dispersion, volumetric particles, halftone density gradients, and scattered noise trails to define the silhouette. Preserve the original subject composition and pose, but simplify details into clean geometric forms. Style should feel like futuristic AI architecture visualization mixed with experimental generative art.\n\nVisual characteristics: black background only, white particle clusters forming the subject, subtle floating debris and dissolving particles around edges, sparse orange/red accent particles (very minimal), cinematic negative space, ultra minimal, soft bloom glow on dense particle areas, depth created through particle density, abstract but recognizable silhouette, no realistic textures, no colors besides black, white, and tiny orange accents, brutalist futuristic design aesthetic, clean composition, vertical poster layout, slight voxel / point-cloud rendering effect, high contrast generative AI art style, experimental architecture visualization aesthetic.\n\nTypography treatment: small thin mono-space typography placed minimally on left and right sides, similar to futuristic design posters, white text only, subtle and secondary to the artwork.\n\nRendering style: octane render, point cloud simulation, particle system render, volumetric dispersion, procedural dots, cinematic lighting, ultra detailed, abstract minimalism.\n\nNegative prompt: realistic shading, painterly textures, colorful backgrounds, low contrast, photorealism, messy composition, extra objects, blur, noisy artifacts, low resolution.", "cat": "machine"}, {"n": "08", "src_set": "Set 01", "name": "Moody Filter", "use": "Colorist role-play prompt. Grade only \u2014 no regeneration. Most faithful of the set.", "note": "", "p": "ROLE\nYou are a senior film colorist and cinematic still-image re-toucher. You grade photographs to look like frames pulled from an atmospheric, emotionally driven film \u2014 never like an over-filtered phone edit.\n\nTASK\nApply a dark, moody, cinematic color grade to the photo I provide. Transform ONLY color, light, and tone. Do not alter, regenerate, reframe, or reinterpret the subject in any way.\n\nNON-NEGOTIABLE PRESERVATION RULES (highest priority)\n- Keep the subject's face, facial features, identity, expression, and pose exactly as in the original.\n- Preserve all structural detail: hair, clothing, background geometry, composition, and sharpness of in-focus areas.\n- This is a GRADE, not a generation. Do not add, remove, or move objects. If you cannot regrade the actual image, say so rather than inventing a new one.\n\nTHE GRADE\nApply these as a layered, balanced look:\n1. SHADOWS: Crush toward deep, rich black with a subtle green-teal tint. Retain just enough detail in the darkest areas \u2014 no solid black blocks, no crushed mud.\n2. MIDTONES: Lower contrast for a soft, atmospheric falloff. Avoid flatness; keep gentle dimensionality.\n3. HIGHLIGHTS: Soft and muted, slightly rolled off. No harsh blown-out whites.\n4. SATURATION: Desaturate the overall palette for a restrained, cinematic mood \u2014 EXCEPT skin tones, which must stay slightly warm, natural, and alive. Never let skin go gray, green, or sickly.\n5. TEXTURE: Add gentle, fine film grain \u2014 present but never noisy or distracting.\n6. ATMOSPHERE: Build a heavy, emotional, contemplative mood reminiscent of moody dramatic cinema (low-key lighting, teal-shadow / warm-skin separation)\n\nINTENSITY\nAim for a refined, professional grade at roughly 70\u201380% strength \u2014 dramatic and emotional, but believable. Restraint beats overprocessing.\n\nSELF-CHECK BEFORE DELIVERING (run silently)\n- Is the face identical to the original?\n- Are skin tones warm and natural, not desaturated?\n- Do shadows retain detail (no pure-black clipping)?\n- Are highlights soft, not blown out?\n- Does it read as a cinematic film still, not a heavy Instagram filter?\nOnly output the result once all checks pass.\n\nOUTPUT\nReturn the re-graded image.", "cat": "grade"}, {"n": "09", "src_set": "Set 01", "name": "Thermal Cam Filter", "use": "FLIR surveillance scan with HUD overlay. Blue cold, orange heat, telemetry text.", "note": "", "p": "Transform the image into an ultra realistic thermal infrared surveillance scan. Preserve original composition and subject structure while converting the scene into authentic false-color thermal imaging. Use realistic FLIR infrared color mapping where cold areas become deep navy, cobalt blue and cyan, while heat signatures become bright yellow, orange and red. Maintain believable thermal gradients and heat distribution rather than random rainbow coloring. Add soft thermal bloom and heat diffusion around warm regions with realistic infrared glow bleed. Include subtle sensor noise, scan grain and digital interference to simulate real thermal camera capture. Overlay minimal surveillance HUD elements including scanner corners, targeting reticle, detection boxes, telemetry text and temperature-style indicators. Contrast should feel machine-generated and high-tech rather than artistic color grading. Preserve silhouettes and geometry while removing natural photographic color. The final image should resemble classified thermal surveillance footage captured by an advanced FLIR imaging system. Military FLIR aesthetic, cyber surveillance scan, classified infrared footage, drone thermal vision, experimental tech interface, tactical imaging realism.", "cat": "machine"}, {"n": "10", "src_set": "Set 01", "name": "CCD Cam Filter", "use": "Labeled CCD in the source post, but the prompt is an anime-frame conversion. Kept verbatim.", "note": "HEADS UP \u2014 slide 10 was titled \"CCD Cam Filter\" but the prompt text under it is an anime-style conversion. Either the post mislabeled it or the caption got swapped. Prompt is transcribed as-is.", "p": "Anime style transformation. Convert the uploaded reference image into a high-quality 2D hand-drawn anime frame while preserving the exact composition, camera angle, framing, crop, perspective, pose, body proportions, object placement, and scene layout from the original image. Keep the image as a faithful anime adaptation of the reference, not a reimagined scene. Do not change the pose, expression, gaze direction, subject placement, clothing layout, background structure, camera distance, or overall visual arrangement.\n\nTranslate all people into detailed anime characters while preserving their recognizable identity, facial structure, age, skin tone, hairstyle, body type, proportions, and expression. Use anime-proportional eyes that match the original face and gaze direction, not oversized generic anime eyes. Simplify the nose and mouth naturally while keeping the likeness accurate. Use clean 2D linework with controlled line weight, confident outlines, accurate anatomy, and sharp silhouette clarity. Render skin with smooth cel shading, soft tonal gradients, natural highlights, and lighting that matches the direction and intensity of the original image. Hair should become defined anime strands while preserving the original shape, flow, volume, and color.\n\nConvert clothing, accessories, objects, and environment into anime style while preserving their original shapes, colors, placement, and material feel. Keep folds, seams, logos, props, shadows, reflections, and small details accurate where visible. The background should become a believable anime environment with the same depth, perspective, lighting, atmosphere, and spatial layout as the reference image. Use clean background painting, subtle cel shading, gentle highlights, faithful colors, and polished modern anime production quality. The final image should look like a still frame from a high-quality anime film or premium anime series. High-fidelity adaptation rather than reinterpretation.\n\nNegative prompt: 3D render, CGI, game art, Pixar style, western comic style, watercolor painting, oil painting, semi-realistic digital painting, glossy AI art, over-smoothed faces, oversized generic anime eyes, changed identity, changed pose, changed camera angle, changed crop, changed outfit, distorted anatomy, broken limbs, extra fingers, warped hands, altered objects, missing background, simplified empty background, blurry linework, messy details, low-quality anime, generic character design.", "cat": "drawn"}, {"n": "11", "src_set": "Set 02", "name": "Minecraft", "use": "Rebuilds the whole scene from vanilla Java blocks. Reads as a real gameplay screenshot, not voxel art.", "note": "", "p": "Transform the uploaded image into an authentic Minecraft (Java Edition, Vanilla) screenshot while preserving the exact composition, framing, perspective, camera angle, subject placement, proportions, pose, and identity of every object in the original image. Every visible object must be rebuilt entirely from official Minecraft blocks using the game's native textures and colors. The final image must be indistinguishable from a real in-game screenshot \u2014 not a realistic voxel render, LEGO model, or smooth 3D artwork.\n\nUse only official Minecraft materials \u2014 recognizable blocks such as grass block, dirt, stone, cobblestone, oak/spruce/birch planks, sand, sandstone, terracotta, concrete, wool, glass, leaves, logs, ice, water, lava, copper, quartz, deepslate, blackstone, brick, moss, and prismarine. Never invent materials.\n\nNo smooth shading, sculpted geometry, rounded surfaces, or realistic textures \u2014 everything must be made from cubes, with no curved geometry, no smooth faces, no rounded noses or hair. Think of it as a Minecraft statue built block-by-block.\n\nUse only colors that exist naturally in Minecraft textures, so the image immediately feels like it belongs inside the game: grass as Minecraft grass green, skin as beige blocks or terracotta, hair as wool/concrete/planks, sky as Minecraft sky blue, water as Minecraft water blue, stone as grey stone blocks, trees as oak/birch/spruce blocks. Avoid realistic skin tones, cinematic color grading, photographic colors, or vibrant HDR \u2014 everything should match Minecraft's slightly muted, pixelated palette.\n\nEvery texture must use authentic 16x16 Minecraft textures with pixel-perfect block faces, visible square pixels, no texture smoothing, no anti-aliasing, and no procedural materials. The environment should be an authentic Minecraft world built only from Minecraft elements \u2014 grass blocks, dirt, hills, trees, water, flowers, clouds, mountains, and villages if applicable \u2014 following Minecraft's world generation logic.\n\nLighting should be Minecraft's native lighting: daylight only (unless the source image is night), flat voxel lighting, block shadows, and ambient occlusion similar to vanilla Minecraft \u2014 no cinematic lighting, studio lighting, ray tracing, or Unreal Engine-style effects.\n\nThe camera should look like a real gameplay screenshot: first-person perspective or a matching camera angle, Minecraft's field of view, slight distance fog, and native depth \u2014 optionally including a crosshair, hotbar, hearts, hunger icons, or XP bar.\n\nPreserve identity, pose, composition, camera angle, expressions, clothing colors, object placement, and scale exactly \u2014 only convert everything into Minecraft blocks. The result should read as an authentic Minecraft Java Edition screenshot using vanilla textures only, like a real gameplay capture and an expert block build \u2014 not a realistic render, smooth voxel art, LEGO appearance, or plastic material, and free of AI hallucination artifacts. Preserve the original aspect ratio exactly.", "cat": "pixel"}, {"n": "12", "src_set": "Set 02", "name": "Cyanotype", "use": "19th-century Prussian-blue contact print on watercolor paper. Has an optional X-ray clause for people and animals.", "note": "", "p": "Transform the uploaded image into an authentic handcrafted cyanotype print while preserving the exact composition, framing, perspective, subject placement, proportions, and visual storytelling of the original image.\n\nX-ray aesthetic: If the uploaded image contains an animal or a person in motion, subtly reveal a semi-transparent skeletal structure inside the body, blended naturally into the cyanotype print. The bones should appear faint and artistic \u2014 not medical or graphic \u2014 matching the ethereal X-ray look seen in experimental cyanotype photography. Preserve anatomy accurately while keeping the overall image elegant and dreamlike.\n\nRecreate the image using the traditional 19th-century cyanotype photographic printing process with rich Prussian blue tones and soft white highlights. The artwork should look like a genuine contact print made on watercolor paper rather than a digital blue filter.\n\nCyanotype characteristics: Deep Prussian blue monochromatic palette. White to pale-blue highlights created naturally by the exposure. Soft tonal transitions with slightly reduced contrast. Fine watercolor paper texture visible throughout. Organic chemical staining, slight uneven coating, and subtle edge variations. Gentle pigment bleeding and handmade imperfections. Slight exposure falloff near the borders. Soft grain from the photographic emulsion. Natural analogue appearance with no artificial digital sharpening.\n\nSubject preservation: Keep every object, person, animal, building, vehicle, and environmental element recognizable. Preserve facial features, clothing, expressions, poses, and anatomy. Maintain all lighting direction and shadows from the original scene. Retain depth, perspective, and composition exactly.\n\nArtistic rendering: Preserve fine details while translating them into cyanotype tonal values. Emphasize silhouettes, edges, and natural textures. Convert colours into cyanotype luminance rather than simply tinting them blue. Produce delicate highlight blooming characteristic of real cyanotype prints. Slightly soften micro-details to emulate contact printing. Maintain realistic tonal separation.\n\nQuality requirements: Museum-quality fine art cyanotype. Ultra-high resolution. Authentic analogue chemistry. Handcrafted photographic print aesthetic. No modern digital effects. No artificial HDR. No oversaturation. No neon blues. No cartoon or painterly look. Preserve the original aspect ratio and composition exactly.", "cat": "camera"}, {"n": "13", "src_set": "Set 02", "name": "Screentone Pop-Art", "use": "Titled pop-art in the source, but the prompt is a paper-craft conversion. See the note.", "note": "HEADS UP \u2014 the slide is titled \u201cScreentone Pop-Art\u201d and the AFTER image is halftone comic art, but the prompt text underneath describes a layered paper cutout. Transcribed as written. For the halftone look you'd want a different prompt.", "p": "Recreate this photo as a handmade layered paper cutout artwork, photographed flat from above. Every element is built from real textured craft paper: visible paper fiber, soft matte felt-like surfaces, slightly fuzzy hand-cut edges, and small realistic drop shadows between layers to show physical depth. Simplify all forms into clean stacked paper shapes: hair becomes layered torn paper strands, fabric folds become separate overlapping cut pieces, patterns become individually cut paper shapes glued on top. Faces are extremely simplified with tiny paper or painted dot eyes and a minimal mouth. Keep the exact composition, pose, arm positions, wardrobe pattern and every element placement from the original. Even soft diffused studio light from above, no harsh shadows, warm matte palette. Craft, tactile, analog. No digital gloss, no photorealistic skin, no gradients.", "cat": "drawn"}, {"n": "14", "src_set": "Set 02", "name": "Byzantine Gold Mosaic", "use": "Sixth-century Ravenna apse mosaic. Gold-leaf tesserae, halo, cracked plaster patch.", "note": "", "p": "Transform this photograph into a sixth-century Byzantine mosaic in the apse of a Ravenna basilica. The whole image is rebuilt from thousands of small hand-cut glass and stone tesserae, each tile individually visible with irregular edges and dark grout between them, set at slightly different angles so the gold catches the light unevenly across the wall. The background becomes a flat field of gold-leaf tesserae with no depth at all, and a plain gold halo sits behind the subject's head. The figure flattens into frontal Byzantine stylisation: drapery reduced to graphic folds outlined in dark tile, eyes enlarged and solemn. The palette holds to gold, lapis blue, oxblood, ivory and charcoal. The surface is genuinely old: some tiles cracked, a patch fallen away to bare plaster, raking light grazing across it. Keep the pose, gesture, framing and composition exactly as they are.", "cat": "drawn"}, {"n": "15", "src_set": "Set 02", "name": "GTA VI Loading Screen", "use": "Rockstar loading-screen illustration. Thick outlines, posterized shading, CRT grain.", "note": "", "p": "Reimagine the uploaded photo as a Grand Theft Auto loading screen artwork (GTA VI style by Rockstar Games). Preserve the exact composition, camera angle, framing, crop, subject position, pose, and scene layout from the original photo \u2014 every element must remain in the same place at the same size. Only the visual medium changes.\n\nRender in the unmistakable Rockstar GTA loading-screen illustration style: a hybrid of photo-realistic underpainting and bold stylized illustration. Subjects rendered with thick clean black outline strokes around the silhouette and key forms, posterized colors with strong flat areas of saturated tone, dramatic high-contrast shading with crisp posterized shadow edges (3-4 tone levels per color), and a slight grainy print texture overlay.\n\nColor palette is rich and saturated with a stylized GTA grade \u2014 vibrant blues, oranges, magentas, deep blacks. Composition has a graphic novel quality \u2014 characters look \"cooler than reality,\" confident, slightly idealized. Background is treated with the same posterized illustration style, often with cinematic depth-of-field, perspective lines pulling toward the subject. Bright sun flare or neon glow accents on highlights. Image has a slight CRT/screen-bleed grain.", "cat": "drawn"}, {"n": "16", "src_set": "Set 02", "name": "Sprite Art", "use": "16-bit console pixel art. ~32 indexed colors, dithered gradients, hard aliased edges.", "note": "", "p": "Convert this photo into 16-bit retro pixel art in the style of a 1990s console game. Chunky visible square pixels with hard aliased edges and no anti-aliasing or blur. Limited indexed palette of roughly 32 colors with dithered checkerboard patterns used for all gradients, especially the sky, smoke and metal reflections. Bold black or dark outline around the main subject to separate it from the background. Simplify the face into a few readable pixel clusters while keeping the recognizable features, hair shape, expression and pose. Keep the exact composition, camera angle, props and every element position from the original. Clean readable sprite silhouette, high contrast, punchy saturated colors. No smooth gradients, no soft focus, no anti-aliased edges, no photographic blur.", "cat": "pixel"}, {"n": "17", "src_set": "Set 02", "name": "Nostalgic Bloom", "use": "Golden rim light plus multicolor bokeh blooms. Music-video backlight, subject stays dark.", "note": "", "p": "Apply a cinematic multicolor luminous effect to the subject while preserving the original pose, facial features, composition, clothing, and camera angle exactly. Surround the subject with soft, out-of-focus multicolored light blooms in vivid cyan blue, electric blue, warm yellow, orange, red, and subtle magenta, creating a dreamy nostalgic atmosphere.\n\nAdd strong warm golden rim lighting around the outer edges of the subject, especially along the hair, face contour, shoulders, and body silhouette. The golden edge light should appear naturally backlit, glowing intensely where the light catches the contours, with subtle white-hot highlights at the brightest points.\n\nCreate a soft cinematic bloom and light diffusion around the highlights, with gentle atmospheric glow spilling into the surrounding background. Keep the subject itself relatively dark and contrasty so the colorful background and golden rim light create a striking silhouette effect.\n\nUse smooth anamorphic-style light flares, subtle chromatic glow, soft lens diffusion, glowing bokeh, and rich color separation. Colors should blend organically rather than looking like flat overlays. Maintain realistic skin and material texture wherever visible.\n\nHigh contrast, deep shadows, luminous highlights, vibrant cyan and yellow color palette with touches of red, orange, and magenta, dreamy nostalgic photography, cinematic backlight, golden hour rim glow, soft halation, realistic optical bloom, premium music-video aesthetic, photorealistic, sophisticated color grading.\n\nIMPORTANT: Do not change the subject's pose, body position, facial expression, proportions, clothing, framing, or composition. Only transform the lighting, colors, glow, bloom, and overall visual atmosphere.", "cat": "grade"}, {"n": "18", "src_set": "Set 02", "name": "1998 GameBoy Cam", "use": "128x112, four shades of gray, Bayer dithering. The most extreme downgrade in the set.", "note": "", "p": "Reimagine the uploaded photo as a photograph taken with the 1998 Nintendo GameBoy Camera accessory. Preserve the exact composition, camera angle, framing, crop, subject position, pose, and scene layout from the original photo \u2014 every element must remain in the same place at the same size. Only the visual medium changes.\n\nApply the strict GameBoy Camera aesthetic: image is exactly 128x112 pixels, displayed at low effective resolution, with only 4 shades of monochrome gray (white, light gray, dark gray, black) \u2014 no color at all. Use heavy ordered dithering (Bayer matrix pattern) to simulate gradients between the four available tones. Image is harsh, contrasty, pixelated, full of dithering noise. The pixels are visible as clear blocky squares. Slight lens distortion at the edges. Faces are recognizable but reduced to clusters of dithered shapes.\n\nCompose the image as if displayed on the small green-tinted GameBoy screen, optionally with a faint green LCD overlay (very subtle), but keep the underlying image strictly 4-tone grayscale. Optional small UI elements at the bottom: \"> PRINT\" or a tiny frame number, in pixelated white text on black.", "cat": "pixel"}, {"n": "19", "src_set": "Set 02", "name": "Manga", "use": "Seinen ink-and-screentone panel. Explicitly a redraw, not a filter pass \u2014 strongest anti-filter wording of any prompt here.", "note": "", "p": "This is not a photo edit or filter. Treat the uploaded photo only as a reference for the subject's facial identity, proportions, and pose \u2014 as if a manga artist studied the photo once, then drew an entirely new illustration by hand from observation. Do not retain or reproduce any of the original photo's actual lighting, shading gradients, or photographic skin-tone rendering anywhere in the final image. The result must look like a fully hand-drawn manga illustration inspired by the photo, not a photo with linework and texture applied on top.\n\nReimagine the uploaded photo as a panel from a refined seinen manga, in the tradition of realistic ink-and-tone manga art (like Vagabond or Berserk) rather than a cute shoujo/anime style. Preserve the exact composition, camera angle, framing, crop, subject position, pose, and scene layout from the original photo \u2014 every element stays in the same place at the same size. Only the visual medium and rendering style change; the underlying pixels, shading, and photographic detail must not carry over.\n\nPure black-and-white, no color, no gray photographic gradients anywhere in the image. Clean, confident inked linework with deliberate weight variation \u2014 bolder for outer silhouette and jaw, fine for interior detail. Lines are precise and controlled, never scratchy or chaotic.\n\nFaces must be fully reconstructed using manga drawing conventions, not rendered realistically. If the face shows soft photographic shading, a gradient skin tone, or a realistic nose/lip render, that is incorrect \u2014 rebuild it using flat, stepped manga tone construction instead. Eyes are sharp, simplified almond shapes with minimal flat iris shading (1-2 tone steps, one small catchlight, no soft gradient). Nose is reduced to a small line or minimal flat shadow shape with no nostril detail or gradient. Mouth is a single clean line with thin, flatly-shaded lips \u2014 no realistic lip texture or gradient. Expression is composed and intense, not soft or cute. Jaw and cheekbones are defined by a few deliberate contour lines, not smooth realistic shading transitions.\n\nHair is rendered as many fine individual strands with natural flow and directional flat shadow blocking \u2014 never a solid black block, never wild or scratchy, and never a soft photographic highlight gradient. Shading throughout the rest of the image (clothing, neck, background) uses dot-pattern screentone as the primary method, with crisp solid black reserved only for the deepest shadow accents. Faces use flatter, simpler shading than the body \u2014 stepped tones only, never a smooth gradient.\n\nBackground stays present and toned \u2014 simplified linework with visible gray screentone or light hatching, not blank white. Add one small Japanese onomatopoeia (e.g. \u30c9\u30ad or \u30b6\u30c3) in a corner with a few thin motion lines nearby. Finish with a thin black panel border. Crisp, clean print quality \u2014 no grain, ink bleed, or aging.", "cat": "drawn"}, {"n": "20", "src_set": "Set 02", "name": "Electron Scan", "use": "Scanning electron microscope render. Grayscale only, edge charging, floating in a black vacuum.", "note": "", "p": "Transform the attached photo into an authentic Electron Scan (SEM \u2014 Scanning Electron Microscope) render.\n\nBACKGROUND \u2014 Replace the entire background with pure, solid black: a total void, no environment, no ground plane, no cast shadows anywhere. The subject should read as if suspended alone inside a microscope's vacuum chamber.\n\nCOLOR & TONALITY \u2014 Render everything in strict grayscale: pure white through mid-grays down to black, zero color anywhere. Keep the tonal range high-key \u2014 the subject should read as pale silver-white against the black void, like a classic secondary-electron SEM image.\n\nSURFACE MICRO-TEXTURE \u2014 Cover every surface of the subject in dense, fine, electron-microscope-style texture: fabric resolves into visible woven fiber/thread texture, skin becomes subtle fine granular texture, hair resolves into individual fine strands, any hard or smooth material picks up fine granular surface noise. Everything should look uniformly \"scanned\" at high magnification, not smooth or photographic.\n\nEDGE GLOW / SECONDARY-ELECTRON EFFECT \u2014 Add a soft luminous glow along the subject's outer contours and silhouette edges, brightest where a surface curves away from the viewer, mimicking the \"edge charging\" brightness seen in real SEM secondary-electron imaging. Keep the core/center of each form a flatter matte gray, with edges rim-lit noticeably brighter.\n\nMATERIAL UNIFORMITY \u2014 Treat all materials (clothing, skin, hair) as the same matte, uncolored, faintly-metallic-plaster substance \u2014 no material-specific shine or color cues; only texture and form should distinguish one material from another.\n\nLEVITATION \u2014 Preserve the subject's exact pose and position from the original, but let it float slightly above the implied ground, with a small visible gap of black void beneath the feet/base \u2014 no ground contact, no cast shadow, reinforcing the sample-in-a-vacuum feel.\n\nFINISH \u2014 Crisp, high-resolution, clinical scientific-imaging aesthetic. No color grading, no depth-of-field blur or bokeh, no warm/cool tint, no photographic film grain (only fine electron-scan texture).\n\nAvoid: any color or colored lighting, visible ground/floor/shadow, smooth untextured surfaces, soft photographic blur, glossy or reflective materials, background detail of any kind, warm skin tones, multiple light sources.", "cat": "machine"}, {"n": "21", "src_set": "Set 02", "name": "Phone to Studio", "use": "Bonus, from a different carousel. Shortest prompt here \u2014 turns a phone snapshot of a product into commercial packshot lighting.", "note": "", "p": "Premium product photography, luxury advertising, elegant lighting with soft shadows, rich deep blacks, subtle reflections on surface, high-end commercial aesthetic, sophisticated color palette, refined details, expensive feel, studio lighting with gentle highlights, aspirational quality.", "cat": "grade"}, {"n": "22", "src_set": "Set 03", "name": "Chromatic Void Effect", "use": "Grows liquid-chrome biomorphic sculpture around an untouched subject. Vogue / Highsnobiety energy.", "note": "The tail of this prompt is garbled in the source (\u201ceditorial) Made with Edits position\u201d looks like a paste artifact). Transcribed as written \u2014 you can safely delete that fragment.", "p": "Transform this image into a premium surreal fashion editorial while preserving the person's identity, facial features, hairstyle, skin tone, outfit, pose, body proportions, and camera angle exactly as they are. Do not replace any clothing, accessories, or facial details. Keep the subject perfectly sharp, photorealistic, and naturally blended.\n\nCreate a realistic composition by surrounding the subject with large organic liquid chrome structures inspired by flowing metal, abstract biomorphic shapes, and futuristic sculptures. The chrome should appear to grow naturally around the subject without covering important body parts or the face. Add realistic reflections, soft shadows, depth, and perspective so the metallic forms feel physically present.\n\nMaintain a clean minimal background while integrating the chrome elements into the environment. Use soft natural daylight with cinematic contrast and subtle highlights. Keep a luxury fashion magazine aesthetic similar to Vogue, Num\u00e9ro, and Highsnobiety editorials. Preserve the original colors of the clothing and skin. Do not add extra people, text, logos, watermarks, or unnecessary objects.\n\nThe final image should feel like a high-end AI fashion campaign with ultra-realistic details, crisp textures, HDR quality, 8K resolution, editorial) Made with Edits position, premium color grading, dramatic depth of field, and professional commercial photography.", "cat": "scene"}, {"n": "23", "src_set": "Set 03", "name": "Doll Effect", "use": "Turns the subject into a boxed collectible action figure. ABS plastic, ball joints, mold seams, oversized head.", "note": "", "p": "Transform the person from the reference image into a high and collectible plastic toy figure, preserving the exact pose, facial expression, hairstyle, outfit colors, accessories, body position, camera angle, framing, composition, and overall scene from the original image. The character should look like an actual manufactured toy, not an animated character.\n\nUse smooth injection molded ABS plastic, glossy painted surfaces, subtle mold seams, crisp panel lines, articulated ball joints at the shoulders, elbows, wrists, hips, knees, and neck, and slightly simplified toy anatomy. The head should be approximately 15-20% larger than realistic proportions, while the body remains balanced like a premium collectible figure.\n\nThe face should retain the person's identity while being translated into a toy sculpt with painted eyes, glossy irises, clean printed eyelashes, simplified eyebrows, sculpted lips, rounded cheeks, painted freckles where applicable, and a polished plastic finish. Hair should become a hard sculpted plastic piece with clean molded strands, satin sheen, and visible sculpt detail rather than realistic hair fibers.\n\nClothing should appear as rigid molded plastic, preserving every wrinkle, fold, stitch, logo, graphic, and texture as sculpted detail instead of fabric simulation. Accessories should become toy-scale plastic or metallic pieces with clean painted finishes while maintaining their original design. Any eyewear should become thick translucent molded plastic, and jewelry should resemble miniature die-cast or chrome plated toy accessories.\n\nPreserve the exact perspective, crop, lens characteristics, lighting direction, and composition from the original image. Reinterpret the entire scene as a miniature collectible toy display, while maintaining the same environment, objects, colors, and spatial relationships found in the reference image. Every visible object should have the appearance of a carefully manufactured toy or miniature prop with premium finishes.\n\nStudio-quality product rendering, physically based rendering (PBR), realistic plastic reflections, glossy highlights, subtle bloom, smooth gradients, crisp edges, vibrant colors, shallow depth of field, ultra-high-resolution, premium collectible finish.\n\nNo Pixar movie aesthetic. No animated character look. No realistic skin. No fabric simulation. No clay textures. No low-poly rendering. No matte surfaces. No horror. No extra characters. No text. No watermarks. The final image should convincingly resemble a professionally photographed premium collectible toy figure rather than a frame from an animated film.", "cat": "scene"}, {"n": "24", "src_set": "Set 03", "name": "Graphic Profile Poster", "use": "Fill-in-the-blank template. Four-color screen-print poster, strict side profile, disk behind the head.", "note": "This one is a template \u2014 replace [CLOTHING], [BACKGROUND ELEMENTS], [PALETTE], [TITLE] and [HEADLINE] before sending, or the model will render the brackets.", "p": "Editorial poster featuring the person in the reference image in strict left-facing profile, cropped from mid-torso, with their hairstyle preserved and forming a dominant graphic silhouette. Dress them in [CLOTHING]. Preserve their recognizable facial structure, proportions, and identity while translating them into a stylized editorial illustration. Place one large flat circular disk directly behind the head. Render crisp flat vector shapes, angular facial features, controlled black contour lines, screen-print grain, halftone dots, and woven grid texture. Build the background using layered [BACKGROUND ELEMENTS], keeping them graphic, minimal, and secondary to the subject. Limit the entire artwork to exactly four high-contrast colors: [PALETTE]. Add the minimalist title \"[TITLE]\" at the upper left in bold condensed uppercase sans serif, with the smaller headline \"[HEADLINE]\" directly beneath it; clear hierarchy, generous negative space, polished editorial composition. Vertical 4:5 aspect ratio.", "cat": "drawn"}, {"n": "25", "src_set": "Set 03", "name": "Avengers Selfie", "use": "Drops the subject into a superhero group selfie outside a cinema at night. Half the prompt is identity lock-in.", "note": "A few words at the end are hidden behind the mute button in the source screenshot \u2014 marked [\u2026]. Also note the prompt says \u201chard daylight\u201d in a night scene; that line looks pasted in from another prompt.", "p": "A wide-angle selfie-style group photo at the entrance of a modern movie theater at night, bright neon marquee lights and illuminated posters behind the group, glass doors reflecting the street and the lobby glow. A tight crowd of superheroes lean into the frame with a casual \"fans photo\" energy: Thor in his armor with red cape on the left, Iron Man centered in full red-and-gold ound, furniture, and lighting are completely photorealistic.\n- Exact original camera angle, composition, perspective, and environment.\n\nMinecraft Food Rules:\n- Convert visible food/drinks into blocky voxel versions of themselves.\n- Use authentic Minecraft textures: pixelated, low-resolution, square edges, visible cube faces, no smooth shading or gloss.\n- Coffee should become a pixelated Minecraft latte/coffee block while still matching the original drink.\n\nAdd floating Minecraft inventory-style labels near each food item using:\n- White pixel font\n- Dark semi-transparent UI boxes\n- Readable placement without covering people\n\nLighting and shadows must match the real scene naturally.\n\nHard Rules:\n- Only food/drinks are transformed\n- No random Minecraft foods added\n- Background and people remain untouched\n- Labels must match the actual food shown in the image", "cat": "pixel"}, {"n": "30", "src_set": "Set 04", "name": "Cyan Motion Portrait", "use": "Half the face sharp, half stretched sideways into cyan VHS smear. Front-facing.", "note": "", "p": "A cinematic retro-VHS portrait of a man, framed from the upper chest to above the head, facing directly toward the camera. He wears transparent glasses and a simple light-colored T-shirt. His face is heavily affected by horizontal motion blur: one side remains clearly visible and sharply recognizable, while the other side is almost completely stretched and obscured by intense directional motion blur. Strong cyan and turquoise lighting dominates the entire image, with deep blue shadows, subtle purple tones, heavy film grain, fine scanlines, VHS noise, and a soft vintage digital texture. Minimal blue-toned background, atmospheric and moody, high contrast, editorial experimental photography, 4:5 aspect ratio.", "cat": "motion", "single": true}, {"n": "31", "src_set": "Set 04", "name": "Red Silhouette Smear", "use": "Three-quarter turn on burnt orange. Face hidden, silhouette does the work.", "note": "", "p": "Cinematic 4:5 portrait of a young man shown from mid-torso up, standing in a three-quarter side profile with his chest and shoulders turned away from the camera, facing right. He occupies most of the frame, slightly right of center. His face is mostly obscured in shadow and motion blur, not clearly visible; the focus is on his silhouette and posture. He wears a fitted black turtleneck. Strong horizontal motion blur trails his hair, head, and upper body toward the left. Bold saturated red and burnt-orange background with a bright orange glow behind him and deeper red edges. Heavy film grain, fine horizontal scanlines, VHS noise, and soft vintage digital texture.", "cat": "motion", "single": true}, {"n": "32", "src_set": "Set 04", "name": "Cyan Halo Ghost", "use": "Backlit profile with a ghosted double-exposure trail dragging left.", "note": "", "p": "A cinematic retro-VHS portrait of a young man wearing a fitted black turtleneck, shown from mid-torso up and occupying most of the frame. His body is turned slightly away from the camera, with his head in a right-facing side profile and slightly lowered. His face is mostly hidden in deep shadow. Strong horizontal motion blur stretches his hair, head, shoulders, and silhouette toward the left, creating a pronounced ghosted/double-exposure trail while the main silhouette remains recognizable. Electric cyan-blue backlight creates a glowing halo around him against a dark blue background. Heavy film grain, fine horizontal scanlines, VHS noise, subtle analog distortion, and soft vintage digital texture.", "cat": "motion", "single": true}, {"n": "33", "src_set": "Set 04", "name": "Double-Exposure Layer", "use": "Sharp subject in front, giant translucent smeared version of himself behind.", "note": "", "p": "Create a cinematic retro-VHS image of a young man wearing a fitted black turtleneck, framed from mid-torso to above the head, filling most of the frame. The foreground man is large and sharp, positioned slightly right of center, facing the camera at a three-quarter side angle, with his head turned slightly left. Behind him is a much larger, translucent double-exposure silhouette of the same man, occupying the background and looking downward, offset toward the left and lower side. The background exposure is heavily stretched with smooth horizontal motion blur, while the foreground face remains more defined with subtle horizontal ghosting around the head and shoulders. Deep electric blue/cyan lighting, bright blue glow behind the subject, dark navy shadows, heavy film grain, fine horizontal scanlines, VHS noise, analog distortion, and soft vintage digital texture.", "cat": "motion", "single": true}];
const IMG = (f,kind)=>(kind==='thumb'?'thumbs/':'images/')+f.n+'.jpg';

const view = document.getElementById('view');
const chipRow = document.getElementById('chips');
let activeCat = 'all';
let query = '';

/* ---------- chips ---------- */
const chipDefs = [['all','All ('+FILTERS.length+')']].concat(
  Object.keys(CATS).map(k => [k, CATS[k].label + ' (' + FILTERS.filter(f=>f.cat===k).length + ')'])
);
chipDefs.forEach(([key,label])=>{
  const b=document.createElement('button');
  b.className='chip'; b.textContent=label; b.dataset.cat=key;
  b.setAttribute('aria-pressed', key==='all');
  b.addEventListener('click',()=>{
    activeCat=key;
    [...chipRow.children].forEach(c=>c.setAttribute('aria-pressed', c.dataset.cat===key));
    if(location.hash.startsWith('#/f/')) location.hash=''; else renderIndex();
  });
  chipRow.append(b);
});

/* ---------- helpers ---------- */
function matches(f){
  const q=query.trim().toLowerCase();
  if(activeCat!=='all' && f.cat!==activeCat) return false;
  if(!q) return true;
  return (f.name+' '+f.use+' '+f.p+' '+CATS[f.cat].label).toLowerCase().includes(q);
}

function copyText(text,btn,label){
  const done=()=>{btn.textContent='\u2713 Copied';btn.classList.add('done');
    setTimeout(()=>{btn.textContent=label;btn.classList.remove('done');},1600);};
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fb(text,done,btn,label));
  } else fb(text,done,btn,label);
}
function fb(text,done,btn,label){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,text.length);
  let ok=false; try{ok=document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
  if(ok) done(); else {btn.textContent='Select and copy manually';setTimeout(()=>btn.textContent=label,2400);}
}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}

/* ---------- index ---------- */
function renderIndex(){
  view.innerHTML='';
  window.scrollTo(0,0);

  const hero=el('div','hero');
  const h1=el('h1'); h1.innerHTML='Filter<br>Prompt <em>Vault</em>';
  hero.append(h1);
  hero.append(el('p','lede',
    FILTERS.length + ' image-to-image prompts with before/after examples. Paste into Nano Banana, Gemini, ChatGPT image, or whatever edit model you run. Pick one, copy it, upload your source photo.'));
  const tools=el('div','hero-tools');
  const all=el('button','btn','Copy all prompts');
  all.addEventListener('click',()=>copyText(
    FILTERS.map(f=>f.n+'. '+f.name.toUpperCase()+'\n'+'-'.repeat(44)+'\n'+f.p).join('\n\n\n'),
    all,'Copy all prompts'));
  tools.append(all);
  hero.append(tools);
  view.append(hero);

  const hits=FILTERS.filter(matches);
  if(!hits.length){
    view.append(el('p','empty','Nothing matches that. Clear the search or pick another category.'));
    return;
  }

  const groups = activeCat==='all' ? Object.keys(CATS) : [activeCat];
  groups.forEach(key=>{
    const inGroup=hits.filter(f=>f.cat===key);
    if(!inGroup.length) return;
    const g=el('div','group');
    g.append(el('h2',null,CATS[key].label));
    g.append(el('p',null,CATS[key].blurb));
    view.append(g);

    const grid=el('div','grid');
    inGroup.forEach(f=>grid.append(tile(f)));
    view.append(grid);
  });
}

function tile(f){
  const b=el('button','tile');
  const wrap=el('div','tile-img');
  const img=el('img');
  img.src=IMG(f,'thumb'); img.loading='lazy'; img.decoding='async'; img.alt=f.name+' example';
  wrap.append(img);
  wrap.append(el('span','tile-n',f.n));
  b.append(wrap);
  if(f.note) b.append(el('div','flag'));
  const body=el('div','tile-body');
  body.append(el('h3',null,f.name));
  body.append(el('span',null,CATS[f.cat].label));
  b.append(body);
  b.addEventListener('click',()=>{location.hash='#/f/'+f.n});
  return b;
}

/* ---------- detail ---------- */
function renderDetail(f){
  view.innerHTML='';
  window.scrollTo(0,0);
  const d=el('div','detail');

  const crumb=el('div','crumb');
  const back=el('button','btn','\u2039 All prompts');
  back.addEventListener('click',()=>{location.hash=''});
  crumb.append(back);
  const k=el('span','kicker');
  k.innerHTML='<b>'+f.n+'</b> \u00b7 '+CATS[f.cat].label+' \u00b7 '+f.src_set;
  crumb.append(k);
  d.append(crumb);

  d.append(el('h1',null,f.name));
  d.append(el('p','use',f.use));
  if(f.note) d.append(el('p','note',f.note));

  const fig=el('figure','shot'+(f.single?' single':''));
  const img=el('img');
  img.src=IMG(f,'full'); img.decoding='async';
  img.alt=f.name+(f.single?' — result':' — before and after');
  fig.append(img);
  fig.append(el('figcaption',null,f.single?'RESULT':'SOURCE / RESULT'));
  d.append(fig);

  d.append(el('div','prompt',f.p));

  const foot=el('div','detail-foot');
  const c=el('button','btn','Copy prompt');
  c.style.flex='1';
  c.addEventListener('click',()=>copyText(f.p,c,'Copy prompt'));
  foot.append(c);
  d.append(foot);

  const idx=FILTERS.indexOf(f);
  const pager=el('div','pager');
  const prev=el('button','btn','\u2039 Prev');
  const next=el('button','btn','Next \u203a');
  if(idx<=0) prev.disabled=true; else prev.addEventListener('click',()=>{location.hash='#/f/'+FILTERS[idx-1].n});
  if(idx>=FILTERS.length-1) next.disabled=true; else next.addEventListener('click',()=>{location.hash='#/f/'+FILTERS[idx+1].n});
  pager.append(prev,next);
  d.append(pager);

  view.append(d);
}

/* ---------- routing ---------- */
function route(){
  const m=location.hash.match(/^#\/f\/(\d+)/);
  if(m){
    const f=FILTERS.find(x=>x.n===m[1].padStart(2,'0'));
    if(f){ renderDetail(f); return; }
  }
  renderIndex();
}
window.addEventListener('hashchange',route);
document.getElementById('home').addEventListener('click',()=>{
  query=''; document.getElementById('search').value='';
  if(location.hash) location.hash=''; else renderIndex();
});
document.getElementById('search').addEventListener('input',e=>{
  query=e.target.value;
  if(location.hash.startsWith('#/f/')) location.hash=''; else renderIndex();
});

const dt=new Date();
document.getElementById('stamp').textContent =
  String(dt.getMonth()+1).padStart(2,'0')+'.'+String(dt.getDate()).padStart(2,'0')+'.'+dt.getFullYear();

route();
</script>
</body>
</html>
